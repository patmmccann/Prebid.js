name: Vitest WebKit cookie diagnostics (throwaway)
on:
  pull_request:
    paths:
      - '.github/workflows/vitest-diag.yml'
      - 'test/vitest-webpack/**'
      - 'test/spec/zzCookieProbe_spec.js'
permissions:
  contents: read
jobs:
  diag:
    name: Diag Safari vs Playwright WebKit (macOS)
    runs-on: macos-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Configure Safari
        run: |
          defaults write com.apple.Safari IncludeDevelopMenu YES
          defaults write com.apple.Safari AllowRemoteAutomation 1
          sudo safaridriver --enable
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" /Applications/Safari.app/Contents/Info.plist || true
          sw_vers
      - run: npx gulp precompile
      - name: Probe, Playwright WebKit
        env:
          VITEST_BROWSER: webkit
        run: VITEST_FILES=test/spec/zzCookieProbe_spec.js npm run test:vitest || true
      - name: Probe, Safari (Karma SafariNative)
        run: npx gulp test-only-nobuild --browsers SafariNative --file test/spec/zzCookieProbe_spec.js --no-coverage || true
