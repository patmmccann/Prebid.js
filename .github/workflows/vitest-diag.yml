name: Vitest WebKit cookie diagnostics (throwaway)
on:
  pull_request:
    paths:
      - '.github/workflows/vitest-diag.yml'
      - 'test/vitest-webpack/**'
      - 'test/spec/zzCookieProbe_spec.js'
permissions:
  contents: read
jobs:
  diag:
    name: Diag webkit macos (sequential)
    runs-on: macos-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx gulp precompile
      - name: Probe, ephemeral context
        env:
          VITEST_BROWSER: webkit
        run: VITEST_FILES=test/spec/zzCookieProbe_spec.js npm run test:vitest || true
      - name: Probe, persistent context
        env:
          VITEST_BROWSER: webkit
          VITEST_PERSISTENT: /tmp/pw-profile-1
        run: VITEST_FILES=test/spec/zzCookieProbe_spec.js npm run test:vitest || true
      - name: Chunk 7, persistent context
        env:
          VITEST_BROWSER: webkit
          VITEST_PERSISTENT: /tmp/pw-profile-2
        run: |
          rm test/spec/zzCookieProbe_spec.js
          TEST_CHUNKS=8 TEST_CHUNK=7 npm run test:vitest || true
